on:
  push:
    branches:
      - main
      - master
      - release/*

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

name: Covr

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          covr::codecov(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(Sys.getenv("RUNNER_TEMP"), "covr-library")
          )
        shell: Rscript {0}

      - name: Show test failures
        if: failure()
        shell: bash
        run: |
          find "${RUNNER_TEMP}/covr-library" -type f -name '*.Rout.fail' -print -exec cat {} \;

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: covr-test-diagnostics
          path: |
            ${{ runner.temp }}/covr-library/**/tsmp-tests/**
          if-no-files-found: ignore
